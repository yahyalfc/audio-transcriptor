services:
  # Redis holds the job_processing and chunk_processing queues and the job/chunk records.
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    # appendonly: persist writes to disk so queued jobs survive a restart.
    # noeviction: required by BullMQ — never silently drop queue keys when memory is full.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # GUI for browsing the keys in Redis: http://localhost:5540 (add database host "redis", port 6379).
  redisinsight:
    image: redis/redisinsight:latest
    container_name: transcription-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  # Transcribing Blackbox: faster-whisper + WhisperX behind a small HTTP API (blackbox/).
  # Service worker 2 POSTs each chunk to http://localhost:8000/transcribe.
  # The first build is slow (torch is large), and the first start downloads the models.
  blackbox:
    build: ./blackbox
    container_name: transcription-blackbox
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small} # tiny / base / small / medium / large-v3 (bigger = better but slower)
      COMPUTE_TYPE: int8 #                     fastest setting on CPU
      DEVICE: cpu #                            no CUDA on a Mac; "cuda" on a GPU server
    volumes:
      - hf-cache:/root/.cache # downloaded models, kept between restarts

volumes:
  redis-data:
  redisinsight-data:
  hf-cache:
